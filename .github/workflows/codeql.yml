name: CodeQL

# Static application security testing (SAST) for a public repo. Runs on every
# push/PR to the protected branches plus a weekly schedule to catch newly
# published query updates. Findings surface in the repo Security tab; to make
# them merge-blocking, mark "CodeQL" as a required status check in branch
# protection (code scanning > high severity).

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (javascript-typescript)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          # security-extended adds higher-signal security queries on top of the
          # default set; JS/TS needs no build step.
          queries: security-extended
      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: '/language:javascript-typescript'
